%YAML:1.0
---
# Camera
camera_index: 0
frame_width: 1280
frame_height: 720

# Calibration board: count INNER corners, not squares
board_cols: 9
board_rows: 6
square_size_m: 0.025      # replace with your measured size

# Markers
marker_length_m: 0.080    # replace with your measured black-edge length

# Output of calibrate_camera, input to pose_app
intrinsics_file: "config/camera_intrinsics.yaml"
